<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecionando | Marcelo Henrique</title>
    <script>
      (() => {
        const path = window.location.pathname + window.location.search + window.location.hash;
        window.location.replace('/?spa-redirect=' + encodeURIComponent(path));
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando para o portfólio...</p>
  </body>
</html>
